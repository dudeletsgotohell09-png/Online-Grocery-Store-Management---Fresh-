<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory — Fresh Admin (UI preview)</title>
<style>

/* ============ Design tokens — "Fresh" theme ============ */
:root{
  --bg: #e3f0bf;
  --surface: #FFFFFF;
  --ink: #1B211C;
  --ink-soft: #5C6660;
  --ink-faint: #8D968E;
  --green: #23553A;
  --green-dark: #163A26;
  --green-pale: #E7F0EA;
  --orange: #EE8A22;
  --orange-dark: #D97710;
  --orange-pale: #FCEEDD;
  --berry: #A6394A;
  --berry-pale: #F7E7E9;
  --blue-pale: #E7EFF8;
  --purple-pale: #EFE7F5;
  --yellow-pale: #FBF3DC;
  --pink-pale: #FBE7EA;
  --border: #E4E7E0;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;
  --font-serif: Georgia, 'Times New Roman', serif;
  --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --shadow-lift: 0 8px 24px rgba(20,30,22,0.08);
  --shadow-card: 0 1px 2px rgba(20,30,22,0.04);
}

*{ box-sizing: border-box; }
body{
  margin:0;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
}
h1,h2,h3,h4{
  font-family: var(--font-sans);
  color: var(--ink);
  margin: 0 0 0.4em 0;
  font-weight: 700;
  letter-spacing: -0.01em;
}
p{ margin: 0 0 1em 0; color: var(--ink-soft); }
a{ color: inherit; text-decoration: none; }
button{ font-family: inherit; cursor: pointer; }
input, select{ font-family: inherit; font-size: 0.95rem; }
:focus-visible{ outline: 2px solid var(--green); outline-offset: 2px; }

.container{ max-width: 1180px; margin: 0 auto; padding: 0 28px; }

/* ============ Buttons ============ */
.btn{
  display: inline-flex; align-items:center; justify-content:center; gap:8px;
  border: none; border-radius: var(--radius-pill);
  padding: 11px 24px; font-size: 0.9rem; font-weight: 700;
  transition: background .15s ease, transform .1s ease;
  text-decoration:none;
}
.btn:active{ transform: scale(0.97); }
.btn-primary{ background: var(--orange); color: #fff; }
.btn-primary:hover{ background: var(--orange-dark); }
.btn-dark{ background: var(--green); color: #fff; }
.btn-dark:hover{ background: var(--green-dark); }
.btn-ghost{ background: transparent; color: var(--green); border: 1.5px solid var(--border); }
.btn-ghost:hover{ background: var(--green-pale); border-color: var(--green); }
.btn-block{ width: 100%; }
.btn-sm{ padding: 8px 16px; font-size: 0.82rem; }

/* ============ Top bar (4-link nav) ============ */
header.topbar{
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff;
  border-bottom: 1px solid var(--border);
}
.topbar-inner{ display:flex; align-items:center; justify-content:space-between; padding: 16px 28px; max-width: 1180px; margin: 0 auto; gap: 24px; }
.brand{ display:flex; align-items:center; gap:8px; font-size: 1.25rem; font-weight:800; letter-spacing:0.01em; color: var(--green); flex-shrink:0; }
.brand .leaf{ font-size: 1.3rem; color: var(--orange); }
.nav-links{ display:flex; align-items:center; gap: 4px; }
.nav-link{ background:none; border:none; padding: 9px 16px; border-radius: var(--radius-pill); font-size:0.92rem; font-weight:600; color: var(--ink-soft); }
.nav-link:hover{ background: var(--green-pale); color: var(--green-dark); }
.nav-link.active{ color: var(--ink); }
.nav-divider{ width:1px; height:22px; background: var(--border); margin: 0 4px; }
.topbar-right{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
.search-box{ display:flex; align-items:center; gap:8px; background: var(--bg); border:1px solid var(--border); border-radius: var(--radius-pill); padding: 8px 16px; min-width:180px; }
.search-box input{ border:none; background:none; outline:none; font-size:0.85rem; width:100%; color: var(--ink); }

/* ============ Auth card (login / register) ============ */
.auth-wrap{ max-width: 440px; margin: 50px auto; background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md); padding: 8px; box-shadow: var(--shadow-lift); }
.auth-tabs{ display:flex; }
.auth-tab-link{ flex:1; text-align:center; padding: 14px 10px; font-weight:700; font-size:0.9rem; color: var(--ink-faint); border-bottom: 2px solid var(--border); }
.auth-tab-link.active{ color: var(--green-dark); border-bottom: 2px solid var(--green); }
.auth-tab-body{ padding: 28px 30px 30px; }
.field{ margin-bottom: 16px; }
.field label{ display:block; font-size: 0.82rem; font-weight:600; color: var(--ink-soft); margin-bottom:6px; }
.field input, .field select{ width:100%; padding: 11px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background:#fff; }
.field input:focus, .field select:focus{ border-color: var(--green); }
.form-error{ background: var(--berry-pale); color: var(--berry); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.83rem; margin-bottom: 14px; }
.form-success{ background: var(--green-pale); color: var(--green-dark); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.83rem; margin-bottom: 14px; }
.auth-switch{ text-align:center; margin-top:16px; font-size:0.85rem; color: var(--ink-soft); }
.auth-switch a{ color: var(--green-dark); font-weight:700; }
.role-tag{ display:inline-block; font-size:0.68rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color: var(--green-dark); background: var(--green-pale); padding: 4px 10px; border-radius: var(--radius-pill); margin-bottom:16px; }

/* ============ Hero banner ============ */
.hero-banner{
  background: var(--green); color:#fff; border-radius: var(--radius-lg);
  display:grid; grid-template-columns: 1.1fr 1fr; align-items:center; gap: 30px;
  padding: 44px 46px; margin: 28px 0 40px; overflow:hidden; position:relative;
}
@media (max-width: 820px){ .hero-banner{ grid-template-columns: 1fr; padding: 32px 26px; } }
.hero-tag{ display:inline-flex; align-items:center; gap:6px; background: rgba(255,255,255,0.14); color:#fff; font-size:0.72rem; font-weight:700; padding: 6px 12px; border-radius: var(--radius-pill); margin-bottom:16px; }
.hero-banner h1{ color:#fff; font-size: 2.15rem; line-height:1.18; margin-bottom: 14px; }
.hero-banner h1 .accent{ color: var(--orange); }
.hero-banner p{ color: rgba(255,255,255,0.78); max-width: 42ch; font-size:0.95rem; }
.hero-visual{
  background: rgba(255,255,255,0.08); border-radius: var(--radius-md);
  min-height: 220px; display:grid; grid-template-columns: repeat(3,1fr); gap:10px;
  padding: 22px; position:relative;
}
.hero-visual .emoji-tile{ background: rgba(255,255,255,0.1); border-radius: 12px; display:flex; align-items:center; justify-content:center; font-size:2rem; aspect-ratio:1; }
.hero-badge{
  position:absolute; background:#fff; color: var(--ink); border-radius: var(--radius-md);
  padding: 9px 14px; font-size:0.76rem; font-weight:700; box-shadow: var(--shadow-lift);
  display:flex; align-items:center; gap:6px;
}
.hero-badge.badge-top{ top:-14px; left:14px; }
.hero-badge.badge-bottom{ bottom:-14px; right:14px; }

/* ============ Two-column dashboard layout ============ */
.dash-layout{ display:grid; grid-template-columns: 1fr 320px; gap: 30px; align-items:start; padding-bottom: 60px; }
@media (max-width: 900px){ .dash-layout{ grid-template-columns: 1fr; } }
.section-heading{ font-size: 1.35rem; margin-bottom:18px; }

/* ============ Category cards ============ */
.category-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 14px; margin-bottom: 40px; }
.category-card{
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md);
  padding: 20px 14px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;
}
.category-card:hover{ border-color: var(--green); }
.category-card.active{ border-color: var(--green); box-shadow: 0 0 0 3px var(--green-pale); }
.category-icon{ width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
.category-card .cat-name{ font-weight:700; font-size:0.92rem; }
.category-card .cat-count{ font-size:0.74rem; color: var(--ink-faint); }

/* ============ Sidebar panels ============ */
.side-panel{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md); padding: 24px; margin-bottom:20px; }
.side-eyebrow{ font-size:0.72rem; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color: var(--orange); margin-bottom:8px; }
.side-panel h3{ font-size:1.1rem; margin-bottom:8px; }
.side-panel > p{ font-size:0.85rem; }
.feature-row{ display:flex; align-items:center; gap:12px; padding: 12px 0; border-top:1px solid var(--border); }
.feature-row:first-of-type{ border-top:none; }
.feature-row .f-icon{ width:34px; height:34px; border-radius:50%; background: var(--bg); display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; }
.feature-row span.f-text{ font-size:0.85rem; font-weight:600; color: var(--ink); }

.mini-product{ display:flex; align-items:center; gap:12px; padding: 12px 0; border-top:1px solid var(--border); }
.mini-product:first-of-type{ border-top:none; }
.mini-product .mp-icon{ width:46px; height:46px; border-radius: var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0; }
.mini-product .mp-name{ font-weight:700; font-size:0.86rem; }
.mini-product .mp-meta{ font-size:0.76rem; color: var(--ink-faint); }
.mini-product .mp-price{ margin-left:auto; font-weight:700; font-size:0.86rem; }

/* ============ Dashboard shell (stat cards / actions) ============ */
.dash-hero{ padding: 30px 0 0; }
.dash-hero .eyebrow{ font-size:0.8rem; font-weight:700; color: var(--green-dark); }
.stat-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 14px; margin: 20px 0 40px; }
.stat-card{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md); padding: 18px 20px; }
.stat-card .stat-value{ font-size: 1.7rem; font-weight:800; color: var(--ink); }
.stat-card .stat-label{ font-size: 0.8rem; color: var(--ink-soft); margin-top:4px; }
.stat-card.warn .stat-value{ color: var(--berry); }

.action-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap: 16px; padding-bottom: 20px; }
.action-card{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md); padding: 22px; display:flex; flex-direction:column; gap:8px; }
.action-card .action-icon{ width: 46px; height:46px; border-radius: 12px; background: var(--green-pale); display:flex; align-items:center; justify-content:center; font-size: 1.3rem; }
.action-card h3{ font-size: 1.02rem; margin: 4px 0 0; }
.action-card p{ font-size: 0.85rem; margin:0; }
.action-card .btn{ margin-top: auto; align-self:flex-start; }

footer.site-footer{ border-top:1px solid var(--border); padding: 26px 0; margin-top: 40px; }
footer.site-footer p{ font-size:0.8rem; text-align:center; margin:0; }

@media (max-width: 720px){
  .topbar-inner{ padding: 14px 18px; flex-wrap:wrap; }
  .nav-links{ order:3; width:100%; justify-content:center; padding-top:10px; border-top:1px solid var(--border); margin-top:10px; }
  .search-box{ display:none; }
}


/* ============ Admin tables ============ */
.admin-head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
table.data-table{ width:100%; border-collapse: collapse; background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md); overflow:hidden; }
table.data-table th{ text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; color: var(--ink-faint); padding: 12px 16px; border-bottom:1px solid var(--border); background:#FAFBF7; }
table.data-table td{ padding: 12px 16px; border-bottom:1px solid var(--border); font-size:0.87rem; vertical-align:middle; }
table.data-table tr:last-child td{ border-bottom:none; }
.row-icon{ width:34px; height:34px; border-radius:9px; background: var(--green-pale); display:inline-flex; align-items:center; justify-content:center; font-size:1rem; }
.stock-out{ color: var(--ink-faint); font-size:0.76rem; font-weight:700; }
.status-select{ padding:6px 10px; border-radius: var(--radius-sm); border:1.5px solid var(--border); font-size:0.82rem; font-weight:700; background:#fff; }
.table-actions{ display:flex; gap:10px; }
.table-actions button, .table-actions a{ background:none; border:none; font-size:0.8rem; font-weight:700; padding:0; cursor:pointer; }
.edit-link{ color: var(--green-dark); }
.del-link{ color: var(--berry); }

/* ============ Order status badges ============ */
.badge{ font-size:0.72rem; font-weight:800; padding: 5px 12px; border-radius: var(--radius-pill); white-space:nowrap; display:inline-block; }
.badge-processing{ background: var(--orange-pale); color:#8a5a1f; }
.badge-shipped{ background: var(--blue-pale); color:#2A5C8A; }
.badge-delivered{ background: var(--green-pale); color: var(--green-dark); }
details.order-items{ margin-top:4px; }
details.order-items summary{ cursor:pointer; font-size:0.8rem; font-weight:700; color: var(--green-dark); }
.oi-row{ display:flex; justify-content:space-between; font-size:0.82rem; padding:5px 0; border-bottom: 1px dashed var(--border); }

/* ============ Simple modal ============ */
.modal-overlay{ position:fixed; inset:0; background: rgba(20,26,22,0.4); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
.modal-overlay.open{ display:flex; }
.modal-box{ background: var(--surface); border-radius: var(--radius-md); padding: 28px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto; }
.modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.icon-btn{ background:none; border:none; font-size:1.2rem; color: var(--ink-soft); padding:4px; cursor:pointer; }
.form-row-2{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
.empty-state{ text-align:center; padding: 60px 20px; color: var(--ink-faint); }
.empty-state .glyph{ font-size:2.2rem; margin-bottom:10px; }

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="admin-dashboard.html" class="brand"><span class="leaf">&#127807;</span> Fresh <span style="font-size:0.7rem; font-weight:700; color:var(--green-dark); background:var(--green-pale); padding:3px 10px; border-radius:999px; margin-left:6px;">Admin</span></a>
    <nav class="nav-links">
      <a href="admin-dashboard.html" class="nav-link">Dashboard</a>
      <a href="admin-inventory.html" class="nav-link active">Inventory</a>
      <a href="admin-orders.html" class="nav-link">Orders</a>
      <a href="login.html" class="nav-link">Log out (Store)</a>
    </nav>
  </div>
</header>

<div class="container" style="padding-bottom:60px;">
  <div class="dash-hero"><h1 style="margin-top:26px;">Inventory</h1></div>

  <div class="admin-head-row">
    <div></div>
    <button type="button" class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add product</button>
  </div>

  <table class="data-table">
    <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
    <tbody id="inventoryBody"></tbody>
  </table>
</div>

<footer class="site-footer"><div class="container"><p>Fresh Grocery — CS12012 Web Development group project.</p></div></footer>

<!-- Add/Edit modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 style="margin:0;" id="modalTitle">Add product</h3>
      <button class="icon-btn" onclick="closeModal()">&#10005;</button>
    </div>
    <form id="productForm" onsubmit="return saveProduct(event)">
      <input type="hidden" id="pfId">
      <div class="field"><label>Icon (emoji)</label><input type="text" id="pfIcon" maxlength="4" value="🛒" required></div>
      <div class="field"><label>Name</label><input type="text" id="pfName" required></div>
      <div class="field">
        <label>Category</label>
        <select id="pfCategory" required>
          <option>Fruits &amp; Veg</option>
          <option>Dairy &amp; Eggs</option>
          <option>Bakery</option>
          <option>Pantry</option>
          <option>Beverages</option>
          <option>Snacks</option>
        </select>
      </div>
      <div class="form-row-2">
        <div class="field"><label>Price (Rs.)</label><input type="number" id="pfPrice" min="0" step="0.01" required></div>
        <div class="field"><label>Unit</label><input type="text" id="pfUnit" value="each" required></div>
      </div>
      <div class="field"><label>Stock quantity</label><input type="number" id="pfStock" min="0" required></div>
      <button type="submit" class="btn btn-primary btn-block">Save product</button>
    </form>
  </div>
</div>

<script>
  // Seed data mirrors schema.sql — this page has no backend, so changes here
  // reset on reload. In the real PHP app (admin/inventory.php) this persists to MySQL.
  let products = [
    {id:1, icon:'🍅', name:'Vine Tomatoes', category:'Fruits & Veg', price:320, unit:'per kg', stock:42},
    {id:2, icon:'🍌', name:'Cavendish Bananas', category:'Fruits & Veg', price:180, unit:'per kg', stock:60},
    {id:3, icon:'🥬', name:'Baby Spinach', category:'Fruits & Veg', price:210, unit:'per bunch', stock:8},
    {id:4, icon:'🥛', name:'Full Cream Milk', category:'Dairy & Eggs', price:410, unit:'1L', stock:35},
    {id:5, icon:'🥚', name:'Free-range Eggs', category:'Dairy & Eggs', price:590, unit:'tray of 10', stock:20},
    {id:6, icon:'🧀', name:'Cheddar Block', category:'Dairy & Eggs', price:940, unit:'200g', stock:0},
    {id:7, icon:'🍞', name:'Sourdough Loaf', category:'Bakery', price:450, unit:'each', stock:14},
    {id:8, icon:'🥐', name:'Butter Croissants', category:'Bakery', price:150, unit:'each', stock:26},
    {id:9, icon:'🍚', name:'Basmati Rice', category:'Pantry', price:980, unit:'5kg bag', stock:18},
    {id:10, icon:'🫒', name:'Olive Oil', category:'Pantry', price:1450, unit:'1L', stock:6},
    {id:11, icon:'🧃', name:'Orange Juice', category:'Beverages', price:390, unit:'1L', stock:22},
    {id:12, icon:'🥜', name:'Roasted Cashews', category:'Snacks', price:680, unit:'200g', stock:30},
  ];

  function render(){
    const body = document.getElementById('inventoryBody');
    body.innerHTML = products.map(p => `
      <tr>
        <td><span class="row-icon">${p.icon}</span></td>
        <td>${p.name}</td>
        <td>${p.category}</td>
        <td>Rs. ${p.price.toFixed(0)} <span style="color:var(--ink-faint);">/ ${p.unit}</span></td>
        <td>${p.stock === 0 ? '<span class="stock-out">Out of stock</span>' : p.stock}</td>
        <td>
          <div class="table-actions">
            <button class="edit-link" onclick="openEditModal(${p.id})">Edit</button>
            <button class="del-link" onclick="deleteProduct(${p.id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function openAddModal(){
    document.getElementById('modalTitle').textContent = 'Add product';
    document.getElementById('productForm').reset();
    document.getElementById('pfId').value = '';
    document.getElementById('pfIcon').value = '🛒';
    document.getElementById('pfUnit').value = 'each';
    document.getElementById('productModal').classList.add('open');
  }
  function openEditModal(id){
    const p = products.find(x => x.id === id);
    document.getElementById('modalTitle').textContent = 'Edit product';
    document.getElementById('pfId').value = p.id;
    document.getElementById('pfIcon').value = p.icon;
    document.getElementById('pfName').value = p.name;
    document.getElementById('pfCategory').value = p.category;
    document.getElementById('pfPrice').value = p.price;
    document.getElementById('pfUnit').value = p.unit;
    document.getElementById('pfStock').value = p.stock;
    document.getElementById('productModal').classList.add('open');
  }
  function closeModal(){ document.getElementById('productModal').classList.remove('open'); }

  function saveProduct(e){
    e.preventDefault();
    const id = document.getElementById('pfId').value;
    const data = {
      icon: document.getElementById('pfIcon').value.trim() || '🛒',
      name: document.getElementById('pfName').value.trim(),
      category: document.getElementById('pfCategory').value,
      price: parseFloat(document.getElementById('pfPrice').value) || 0,
      unit: document.getElementById('pfUnit').value.trim() || 'each',
      stock: parseInt(document.getElementById('pfStock').value) || 0,
    };
    if(id){
      Object.assign(products.find(p => p.id === parseInt(id)), data);
    } else {
      data.id = Date.now();
      products.push(data);
    }
    closeModal();
    render();
    return false;
  }

  function deleteProduct(id){
    if(!confirm('Delete this product?')) return;
    products = products.filter(p => p.id !== id);
    render();
  }

  render();
</script>

</body>
</html>
